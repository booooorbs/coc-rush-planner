plugins {
    id "com.android.application"
}

android {
    namespace "net.booooorbs.rushplanner"
    compileSdk 35

    defaultConfig {
        applicationId "net.booooorbs.rushplanner"
        minSdk 28
        targetSdk 35
        // CI passes its run number so every build installs over the previous one.
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
        versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
        // Hash of android/ (CI sets it). The updater only reinstalls the APK when this changes;
        // otherwise it just downloads the new page.
        buildConfigField "String", "NATIVE_HASH", "\"" + (System.getenv("NATIVE_HASH") ?: "dev") + "\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        // A fixed debug key (committed) so a new APK installs as an update and keeps saved exports.
        debug {
            storeFile rootProject.file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // The web app is the same file the artifact build produces (scripts/build.py).
    sourceSets {
        main {
            assets.srcDirs += [rootProject.file("../dist")]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "androidx.core:core:1.13.1"
}
