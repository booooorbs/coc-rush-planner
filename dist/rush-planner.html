<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
</head>
<body>
<title>Rush Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout: one narrow working column, sticky village header + tab bar, cards only for builder slots and alerts */
:root{
  --bg:#eceff2; --surface:#ffffff; --sunk:#f5f7f9; --ink:#1b2129; --muted:#5b6672; --line:#d6dce2;
  --gold:#b27a00; --gold-soft:#fff3d1; --elixir:#8a3ccf; --de:#4a3566;
  --ok:#2b7d46; --ok-soft:#e1f3e7; --warn:#a85f00; --warn-soft:#fdeed6; --crit:#b3312a; --crit-soft:#fbe3e1;
  --bar:#dfe4ea;
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --f-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151a; --surface:#1b1f26; --sunk:#161a20; --ink:#e7eaee; --muted:#9aa5b1; --line:#2b313a;
  --gold:#f1b532; --gold-soft:#3a2f12; --elixir:#c08cf5; --de:#b9a3d9;
  --ok:#55c27e; --ok-soft:#163222; --warn:#f0a542; --warn-soft:#3a2a12; --crit:#f07067; --crit-soft:#3a1a18;
  --bar:#2a3039; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151a; --surface:#1b1f26; --sunk:#161a20; --ink:#e7eaee; --muted:#9aa5b1; --line:#2b313a;
  --gold:#f1b532; --gold-soft:#3a2f12; --elixir:#c08cf5; --de:#b9a3d9;
  --ok:#55c27e; --ok-soft:#163222; --warn:#f0a542; --warn-soft:#3a2a12; --crit:#f07067; --crit-soft:#3a1a18;
  --bar:#2a3039; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
.wrap{max-width:760px;transition:max-width .2s;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.th{font-family:var(--f-display);font-size:22px;line-height:1;background:var(--gold);color:var(--surface);border-radius:10px;padding:8px 10px 6px;letter-spacing:.5px}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;letter-spacing:.3px}
.meta{color:var(--muted);font-size:13px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{font:inherit;font-weight:700;font-size:14px;background:none;border:0;color:var(--muted);padding:8px 12px 10px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
nav.tabs button:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
section.view{display:flex;flex-direction:column;gap:22px;padding-top:18px}
h2{font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:.3px;margin:0 0 8px;text-wrap:balance}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px;font-weight:800}
p{margin:0}
.sub{color:var(--muted);font-size:13.5px}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;font-size:14px}
.alert b{font-weight:800}
.alert.crit{background:var(--crit-soft);color:var(--ink)}.alert.crit .dot{background:var(--crit)}
.alert.warn{background:var(--warn-soft)}.alert.warn .dot{background:var(--warn)}
.alert.ok{background:var(--ok-soft)}.alert.ok .dot{background:var(--ok)}
.alert.info{background:var(--gold-soft)}.alert.info .dot{background:var(--gold)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:6px}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:28px 1fr auto;gap:2px 10px;align-items:center}
.slot .n{grid-row:span 2;font-family:var(--f-display);font-size:18px;color:var(--muted);text-align:center}
.slot .now{font-weight:700;min-width:0}
.slot .eta{font-weight:800;text-align:right;white-space:nowrap}
.slot .next{grid-column:2 / span 2;font-size:13.5px;color:var(--muted);min-width:0}
.slot .next b{color:var(--ink)}
.slot.free{border-color:var(--crit);border-style:dashed}
.slot.free .eta{color:var(--crit)}
.slot.lab .n{color:var(--elixir)}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:9px 12px;border-top:1px solid var(--line);align-items:center}
.row:first-child{border-top:0}
.row .name{font-weight:700;min-width:0}
.row .why{grid-column:1 / -1;font-size:13px;color:var(--muted)}
.row .right{text-align:right;font-size:13px;color:var(--muted);white-space:nowrap}
.row.dim .name{color:var(--muted);font-weight:600}
.chip{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:1px 8px;margin-right:6px;vertical-align:1px;border:1px solid var(--line);color:var(--muted)}
.chip.t1{background:var(--gold);color:var(--surface);border-color:var(--gold)}
.chip.t2{background:var(--gold-soft);color:var(--ink);border-color:var(--gold)}
.chip.t3{color:var(--elixir);border-color:var(--elixir)}
.chip.busy{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.block{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.check{display:flex;flex-direction:column;gap:6px}
.ci{display:flex;gap:10px;align-items:baseline}
.ci .mk{width:18px;flex:none;font-weight:800;text-align:center}
.ci.ok .mk{color:var(--ok)} .ci.busy .mk{color:var(--warn)} .ci.todo .mk{color:var(--crit)}
.ci .t{flex:1;min-width:0}
.ci .s{color:var(--muted);font-size:13px;white-space:nowrap}
.res-Gold{color:var(--gold)} .res-Elixir{color:var(--elixir)} .res-Dark{color:var(--de)}
.bar{height:6px;border-radius:3px;background:var(--bar);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.bar.full i{background:var(--ok)}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:2px 12px;padding:8px 12px;border-top:1px solid var(--line);align-items:center}
.trow:first-child{border-top:0}
.trow .lv{font-size:13px;color:var(--muted);text-align:right}
.trow .bar{grid-column:1 / -1}
.trow .inst{grid-column:1 / -1;font-size:12.5px;color:var(--muted)}
.secthead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px}
.pct{font-family:var(--f-display);font-size:18px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.sum span{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.sum b{font-family:var(--f-display);font-weight:400;font-size:20px}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details > summary{cursor:pointer;padding:10px 12px;font-weight:700;list-style:none}
details > summary::-webkit-details-marker{display:none}
details > summary::before{content:"▸";display:inline-block;width:16px;color:var(--muted)}
details[open] > summary::before{content:"▾"}
details .inner{border-top:1px solid var(--line)}
.guide{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;max-width:68ch}
.guide ol,.guide ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.guide .here{background:var(--gold-soft);border-radius:8px;padding:8px 10px}
textarea{width:100%;min-height:150px;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:800;font-size:14px;border-radius:10px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--surface)}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{font:inherit;font-size:13px;font-weight:700;border-radius:999px;padding:4px 10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.pick[aria-pressed="true"]{background:var(--elixir);border-color:var(--elixir);color:var(--surface)}
.msg{font-size:14px;font-weight:700}
.msg.err{color:var(--crit)} .msg.ok{color:var(--ok)}
.field{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.vsel{font:inherit;font-weight:700;font-size:13px;max-width:100%;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);margin-top:4px}
.vlist{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.vrow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.vrow.on{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.vrow .vname{flex:1 1 160px;min-width:0;font:inherit;font-weight:700;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);color:var(--ink)}
.vrow .vinfo{flex:1 1 100%;order:3;color:var(--muted);font-size:13px}
.vrow .btn{padding:6px 12px}
.vrow .btn.arm{background:var(--crit);border-color:var(--crit);color:var(--surface)}
.field input{width:70px;font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.eq{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:8px 12px;border-top:1px solid var(--line)}
.eq:first-child{border-top:0}
.eq .bar{grid-column:1 / -1}
.muted{color:var(--muted)}
.wrap.wide{max-width:1240px}
.tl-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-weight:800;font-size:13px;padding:6px 12px;border:0;background:var(--surface);color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.tl{display:grid;grid-template-columns:92px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tl-labels{border-right:1px solid var(--line);background:var(--sunk)}
.tl-labels div{height:56px;white-space:nowrap;display:flex;align-items:center;padding:0 10px;font-weight:800;font-size:13px;border-top:1px solid var(--line)}
.tl-labels div:first-child{height:34px;border-top:0;color:var(--muted);font-weight:700;font-size:12px}
.tl-scroll{overflow-x:auto;position:relative}
.tl-canvas{position:relative}
.tl-axis{height:34px;position:relative;border-bottom:1px solid var(--line)}
.tl-day{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-size:12px;color:var(--muted);padding:3px 0 0 5px;white-space:nowrap}
.tl-day.wk{color:var(--ink);font-weight:800}
.tl-row{height:56px;position:relative;border-top:1px solid var(--line)}
.tl-row:first-of-type{border-top:0}
.tl-grid{position:absolute;top:34px;bottom:0;border-left:1px dashed var(--line);pointer-events:none}
.tl-hr{position:absolute;top:17px;font-size:11px;color:var(--muted);padding-left:4px;white-space:nowrap}
.tl-grid.hr{border-left-style:dotted;opacity:.6}
.gantt{display:flex;flex-direction:column;gap:8px}
.gz .seg button{min-width:40px;padding:5px 12px;font-size:15px}
.tl-scroll{cursor:grab;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
/* keep a bar's name in view when the bar starts left of the visible area (clip, not hidden, so sticky works) */
.tl-bar b,.tl-bar span{position:sticky;left:6px;max-width:max-content}
.tl-bar.mv{cursor:grab;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tl-bar.dragging{z-index:6;opacity:.9;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:grabbing;pointer-events:none}
.tl-scroll.moving{cursor:grabbing}
.tl-row.drop{background:var(--gold-soft)}
.tl-scroll.grab{cursor:grabbing;user-select:none}
.tl-now{position:absolute;top:0;bottom:0;width:2px;background:var(--crit);z-index:3;pointer-events:none}
.tl-bar{position:absolute;top:6px;height:44px;border-radius:7px;padding:4px 8px;overflow:clip;white-space:nowrap;font-size:12px;line-height:1.3;border:1px solid transparent;box-sizing:border-box;z-index:2}
.tl-bar b{display:block;font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.tl-bar span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:block}
.tl-bar.k-hero{background:var(--gold-soft);border-color:var(--gold)}
.tl-bar.k-gate{background:var(--warn-soft);border-color:var(--warn)}
.tl-bar.k-th{background:var(--gold);color:var(--surface)} .tl-bar.k-th span,.tl-bar.k-th em{color:var(--surface)!important}
.tl-bar.k-off{background:var(--sunk);border-color:var(--elixir)}
.tl-bar.k-econ{background:var(--ok-soft);border-color:var(--ok)}
.tl-bar.k-def{background:var(--sunk);border-color:var(--line)}
.tl-bar.k-lab{background:var(--sunk);border-color:var(--elixir);border-style:dashed}
.tl-bar.now-running{box-shadow:inset 3px 0 0 var(--crit)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid}
.tl-bar.warn{border-color:var(--crit)!important;box-shadow:inset 0 -3px 0 var(--crit)}
/* My Plan */
.mp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px;align-items:start}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.q-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 12px;background:var(--sunk);border-bottom:1px solid var(--line)}
.q-h b{font-family:var(--f-display);font-weight:400;font-size:17px;letter-spacing:.3px}
.q-h .sub{text-align:right;font-size:12.5px}
.qi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 10px 8px 12px;border-top:1px solid var(--line);align-items:center}
.q-h+.qi{border-top:0}
.qi .nm{grid-column:1;grid-row:1;min-width:0}
.qi .tm{grid-column:2;grid-row:1;text-align:right;font-size:13px;font-weight:700;white-space:nowrap}
.qi .dt{grid-column:1 / -1;font-size:12.5px;color:var(--muted);min-width:0}
.qi .r2{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.qi .ctl{display:flex;gap:4px;margin-left:auto}
.qi .wn{grid-column:1 / -1;font-size:12.5px;color:var(--crit);font-weight:700}
.qi.run{background:var(--gold-soft)}
.qi.run .dt{grid-column:1 / -1}
.qi.bad{box-shadow:inset 3px 0 0 var(--crit)}
.ib{font:inherit;font-weight:800;font-size:13px;min-width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;padding:0 6px}
.ib:disabled{opacity:.35;cursor:default}
.ib.del{color:var(--crit)}
select{font:inherit;font-size:13px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 6px}
select.mv{max-width:104px}
.q-add{font:inherit;font-weight:800;font-size:14px;margin:8px;padding:9px;border-radius:10px;border:1px dashed var(--line);background:none;color:var(--muted);cursor:pointer}
.q-add:hover{color:var(--ink);border-color:var(--gold)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--bg);color:var(--ink);width:100%;max-width:640px;max-height:88vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column;gap:10px;padding:14px 16px calc(10px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet{align-items:center}.sheet .panel{border-radius:16px;max-height:80vh}}
.sh-h{display:flex;justify-content:space-between;align-items:center}
.sh-f{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sh-f input{flex:1;min-width:140px;font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.sh-list{overflow-y:auto;flex:1;min-height:120px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overscroll-behavior:contain}
.sh-list h3{padding:10px 12px 2px;margin:0}
.sh-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line)}
.sh-list h3+.sh-row{border-top:0}
.sh-row .ctl{display:flex;gap:6px;flex:none}
.sh-row .btn{padding:6px 12px;min-width:40px}
.sh-row .chip{margin:0 0 0 4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="th" id="thBadge">TH?</div>
      <div style="min-width:0;flex:1">
        <h1>Rush Planner</h1>
        <div class="meta" id="meta"></div>
        <select class="vsel" id="vsel" aria-label="Village" hidden></select>
      </div>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-v="plan" aria-selected="true">Plan</button>
      <button role="tab" data-v="timeline" aria-selected="false">Timeline</button>
      <button role="tab" data-v="myplan" aria-selected="false">My Plan</button>
      <button role="tab" data-v="lab" aria-selected="false">Lab &amp; Pets</button>
      <button role="tab" data-v="heroes" aria-selected="false">Heroes &amp; Gear</button>
      <button role="tab" data-v="tracker" aria-selected="false">Tracker</button>
      <button role="tab" data-v="guide" aria-selected="false">Guide</button>
      <button role="tab" data-v="import" aria-selected="false">Update</button>
    </nav>
  </header>
  <main>
    <section class="view" id="v-plan"></section>
    <section class="view" id="v-timeline" hidden></section>
    <section class="view" id="v-myplan" hidden></section>
    <section class="view" id="v-lab" hidden></section>
    <section class="view" id="v-heroes" hidden></section>
    <section class="view" id="v-tracker" hidden></section>
    <section class="view" id="v-guide" hidden></section>
    <section class="view" id="v-import" hidden></section>
  </main>

const when=ms=>{const d=new Date(ms);return d.toLocaleString(undefined,{weekday:"short",hour:"numeric",minute:"2-digit"})};

// ---------- level math ----------
function capBy(L,ok){let m=0;L.forEach((l,i)=>{if(ok(l))m=Math.max(m,i+1)});return m}
const bCap=(id,th)=>{const g=GD.B[id]||GD.T[id];return g?capBy(g.L,l=>l[0]<=th):0};
const hCap=(id,th,hh)=>capBy(GD.H[id].L,l=>l[0]<=th&&(hh==null||l[1]<=hh));
const uDef=id=>GD.U[id]||GD.SP[id];
const uCap=(id,th,lab)=>capBy(uDef(id).L,l=>l[0]<=th&&(lab==null||l[1]<=lab));
const pCap=(id,th,ph)=>capBy(GD.P[id].L,l=>l[0]<=th&&(ph==null||l[1]<=ph));
const eCap=(id,th,bs)=>GD.E[id]?capBy(GD.E[id].L,l=>l[0]<=th&&(bs==null||l[1]<=bs)):0;
function bNext(id,lvl){const g=GD.B[id]||GD.T[id];const l=g&&g.L[lvl];return l?{time:l[1],cost:l[2],res:g.r}:null}
function rNext(def,lvl){const cur=def.L[lvl-1];return cur?{time:cur[2],cost:cur[3],req:def.L[lvl]?def.L[lvl][1]:99}:null}

// ---------- parse export ----------
function parseVillage(j){
  if(!j||!Array.isArray(j.buildings))throw new Error("That doesn't look like a village export. It should start with {\"tag\":\"#...\" and contain \"buildings\".");
  const v={tag:j.tag||"",ts:(j.timestamp||Date.now()/1000)*1000,th:0,thTimer:0,b:{},traps:{},units:{},heroes:{},pets:{},equip:{},helpers:{}};
  for(const e of j.buildings){
    if(e.data===ID.TH){v.th=e.lvl;v.thTimer=e.timer||0;continue}
    if(!GD.B[e.data]||e.lvl==null)continue;
    (v.b[e.data]||(v.b[e.data]=[])).push({lvl:e.lvl,n:e.cnt||1,timer:e.timer||0});
  }
  for(const e of j.traps||[]){if(GD.T[e.data])(v.traps[e.data]||(v.traps[e.data]=[])).push({lvl:e.lvl,n:e.cnt||1,timer:e.timer||0})}
  for(const e of [...(j.units||[]),...(j.siege_machines||[]),...(j.spells||[])]){if(uDef(e.data))v.units[e.data]={lvl:e.lvl,timer:e.timer||0}}
  for(const e of j.heroes||[]){if(GD.H[e.data])v.heroes[e.data]={lvl:e.lvl,timer:e.timer||0}}
  for(const e of j.pets||[]){if(GD.P[e.data])v.pets[e.data]={lvl:e.lvl,timer:e.timer||0}}
  for(const e of j.equipment||[])v.equip[e.data]=e.lvl;
  for(const e of j.helpers||[])v.helpers[e.data]=e.lvl;
  if(!v.th)throw new Error("Couldn't find the Town Hall in this export.");
  return v;
}
const bLvl=(v,id)=>{const g=v.b[id];return g?Math.max(...g.map(x=>x.lvl)):0};
const count=(g)=>g?g.reduce((a,x)=>a+x.n,0):0;

// ---------- settings ----------
const DEFAULT_SET={farm:[4000059,4000002,4000012],spells:[26000000,26000002,26000005],builders:0,style:"5d"};
let SET=Object.assign({},DEFAULT_SET,vget("vs",{}));

// ---------- state for planning ----------
// Expanded per-instance state so the planner can simulate builders finishing.
function makeState(v){
  // t = the moment being planned; until = when a busy builder frees up.
  const st={t:Date.now(),total:SET.builders||builderCount(v),th:v.th,thBusy:!!v.thTimer,thUntil:v.ts+v.thTimer*1000,b:{},h:{},other:[]};
  for(const id in v.b){if(+id===ID.WALL)continue;st.b[id]=[];for(const g of v.b[id])for(let k=0;k<g.n;k++)st.b[id].push({lvl:g.lvl,busy:!!g.timer,until:v.ts+g.timer*1000})}
  for(const id in v.traps)for(const g of v.traps[id])if(g.timer)st.other.push(v.ts+g.timer*1000);
  for(const id in v.heroes)st.h[id]={lvl:v.heroes[id].lvl,busy:!!v.heroes[id].timer,until:v.ts+v.heroes[id].timer*1000};
  return st;
}

const sLvl=(st,id)=>st.b[id]&&st.b[id].length?Math.max(...st.b[id].map(x=>x.lvl)):0;

function busyJobs(v){
  const out=[];const t0=v.ts;
  if(v.thTimer)out.push({kind:"b",id:ID.TH,name:"Town Hall",from:v.th,finish:t0+v.thTimer*1000});
  for(const id in v.b)for(const g of v.b[id])if(g.timer)out.push({kind:"b",id:+id,name:GD.B[id].n,from:g.lvl,finish:t0+g.timer*1000});
  for(const id in v.traps)for(const g of v.traps[id])if(g.timer)out.push({kind:"b",id:+id,name:GD.T[id].n,from:g.lvl,finish:t0+g.timer*1000});
  for(const id in v.heroes){const h=v.heroes[id];if(h.timer)out.push({kind:"h",id:+id,name:GD.H[id].n,from:h.lvl,finish:t0+h.timer*1000})}
  return out.sort((a,b)=>a.finish-b.finish);
}

function requiredCounts(th){const c={};for(let t=1;t<=th;t++)for(const [id,q] of (GD.UNL[t]||[]))c[id]=(c[id]||0)+q;return c}

function mainHero(st,v){
  // Tee: one builder on the Archer Queen 24/7; if she is capped or blocked, the hero closest to 8-day upgrades.
  const hh=sLvl(st,ID.HH);
  const ok=id=>st.h[id]&&st.h[id].lvl<hCap(+id,st.th,hh);
  if(ok(HERO.AQ))return HERO.AQ;
  let best=null,bt=-1;
  for(const id in st.h){if(!ok(id))continue;const n=rNext(GD.H[id],st.h[id].lvl);if(n&&n.time>bt){bt=n.time;best=+id}}
  return best;
}


// Ranked candidate jobs for a builder, given the projected state.
// dlimms' 5D Rush Plan: what to finish at each Town Hall (building, target level, how many).
// Order is the table order in the plan. Other Town Halls fall back to Tee's checklist.
const P5D={
  13:[[ID.HH,7],[ID.LAB,11],[ID.BS,6],[ID.CC,9],[ID.SF,7],[ID.CAMP,11],[ID.DES,8],[ID.GS,14],[ID.ES,14]],
  14:[[ID.HH,8],[ID.PET,3],[ID.LAB,12],[ID.BS,7],[ID.EAGLE,3],[ID.CC,10],[ID.DES,9],[ID.ES,15]],
  15:[[ID.HH,9],[ID.PET,8],[ID.LAB,13],[ID.CC,11],[ID.SF,8],[ID.CAMP,12]],
  16:[[ID.PET,10],[ID.LAB,14],[ID.CC,12],[ID.SF,9],[ID.AT,21,4],[ID.CANNON,21,4],[ID.EAGLE,7]]};
const uses5D=th=>SET.style!=="tee"&&!!P5D[th];
function gateList(th){
  if(uses5D(th))return P5D[th].map(([id,t,n])=>({id,target:Math.min(t,bCap(id,th)),n:n||0}));
  return GATE.map(id=>({id,target:bCap(id,th),n:0}));
}
// The instances a checklist entry covers (for "x4" entries, the four highest).
function gateInst(st,g){const arr=(st.b[g.id]||[]).slice().sort((a,b)=>b.lvl-a.lvl);return g.n?arr.slice(0,g.n):arr}
function newBuildingNeeds(st){
  const req=requiredCounts(st.th);const out=[];
  for(const id in req){if([ID.WALL,ID.HUT,ID.BOB,ID.CRAFT].includes(+id)||!GD.B[id])continue;
    if(st.th>=16&&[ID.CANNON,ID.AT,ID.WT].includes(+id))continue; // merged at TH16+
    const arr=st.b[id]||[];out.push({id:+id,req:req[id],have:arr.length,built:arr.filter(x=>x.lvl>0).length,building:arr.filter(x=>x.lvl===0&&x.busy)});}
  return out;
}

// Start the Town Hall as soon as the rest of the checklist, packed onto the other builders,
// still finishes before the Town Hall lands, so every builder finishes together (5D plan).
function thFits(st,v){
  const t=st.t;const n=bNext(ID.TH,st.th);if(!n)return false;const deadline=t+n.time*1000;
  const work=[],gateFree=[];let mustEnd=t;const gl=gateList(st.th);
  const seenBusy=new Set();
  for(const g of gl){const L=GD.B[g.id].L;
    for(const x of gateInst(st,g)){let rest=0;for(let l=x.lvl+(x.busy?1:0);l<g.target;l++)rest+=L[l][1]*1000;
      if(x.busy){seenBusy.add(x);mustEnd=Math.max(mustEnd,x.until+rest);gateFree.push(x.until+rest)}else if(rest)work.push(rest);}}
  for(const nb of newBuildingNeeds(st)){const L=GD.B[nb.id].L;const g=gl.find(g=>g.id===nb.id);const tgt=g?Math.max(1,g.target):1;
    let one=0;for(let l=0;l<tgt;l++)one+=Math.max(60,L[l][1])*1000;
    for(let k=nb.have;k<nb.req;k++)work.push(one);
    for(const x of nb.building)if(!seenBusy.has(x)){mustEnd=Math.max(mustEnd,x.until);gateFree.push(x.until)}}
  if(mustEnd>deadline)return false;
  if(!work.length)return true;
  // Builders left for that work: everyone except the Town Hall builder and the hero builder.
  const main=mainHero(st,v);const avail=[];
  for(const id in st.b)for(const x of st.b[id])if(x.busy&&!seenBusy.has(x)&&!(x.lvl===0))avail.push(x.until);
  for(const id in st.h)if(st.h[id].busy&&+id!==main)avail.push(st.h[id].until);
  for(const u of st.other)if(u>t)avail.push(u);
  const busyCount=Object.values(st.b).flat().filter(x=>x.busy).length+Object.values(st.h).filter(h=>h.busy).length+st.other.filter(u=>u>t).length+(st.thBusy?1:0);
  let free=st.total-busyCount-1;if(main&&!st.h[main].busy)free--;
  for(let k=0;k<free;k++)avail.push(t);
  avail.push(...gateFree);
  if(!avail.length)return false;
  work.sort((a,b)=>b-a);
  let end=t;for(const w of work){avail.sort((a,b)=>a-b);const s0=Math.max(t,avail.shift());end=Math.max(end,s0+w);avail.push(s0+w)}
  return end<=deadline;
}
function gateStatus(st,v){
  const items=[];
  for(const g of gateList(st.th)){if(!g.target)continue;const inst=gateInst(st,g);
    const left=inst.filter(x=>x.lvl<g.target&&!x.busy).length,busy=inst.filter(x=>x.busy&&x.lvl<g.target).length;
    if(!inst.length&&newBuildingNeeds(st).some(nb=>nb.id===g.id))continue; // shown as a new building below
    items.push({id:g.id,label:(inst.length>1?inst.length+"× ":"")+GD.B[g.id].n+" to "+g.target,state:left?"todo":busy?"busy":"ok",left,busy});}
  for(const nb of newBuildingNeeds(st))if(nb.req>0&&nb.built<nb.req){
    const g=gateList(st.th).find(g=>g.id===nb.id);
    items.push({id:nb.id,newb:true,label:"Place "+nb.req+"× "+GD.B[nb.id].n+(g&&g.target>1?" (new, to "+g.target+")":" (new)"),state:nb.have<nb.req?"todo":nb.building.length?"busy":"todo",left:nb.req-nb.have,busy:nb.building.length});}
  return items;
}
function candidates(st,v,labBlocking){
  const out=[];const th=st.th;const hh=sLvl(st,ID.HH);
  const main=mainHero(st,v);const gl=gateList(th);const fived=uses5D(th);
  const add=(o)=>out.push(o);
  // heroes
  for(const id in st.h){const h=st.h[id];const cap=hCap(+id,th,hh),capT=hCap(+id,th);if(h.busy||h.lvl>=capT)continue;
    const n=rNext(GD.H[id],h.lvl);const blocked=h.lvl>=cap;
    const isMain=+id===main||(th>=18&&[HERO.AQ,HERO.GW,HERO.RC].includes(+id));
    add({key:"h"+id,kind:"h",id:+id,name:GD.H[id].n,from:h.lvl,to:h.lvl+1,time:n.time,cost:n.cost,res:GD.H[id].r,
      tier:isMain?1:4,ord:HERO_ORDER.indexOf(+id),blocked:blocked?"Needs Hero Hall "+GD.H[id].L[h.lvl][1]:"",
      why:isMain?(+id===HERO.AQ?"Keep one builder on the Archer Queen 24/7":"Hero closest to 8-day upgrades stays busy"):"Second hero, only when nothing above is open"});}
  // buildings
  for(const id in st.b){const iid=+id;const g=GD.B[id];const cap=bCap(iid,th);
    const gi=gl.findIndex(x=>x.id===iid);const ge=gl[gi];
    const pool=ge?gateInst(st,ge).filter(x=>!x.busy&&x.lvl<ge.target):[];
    const free=pool.length?pool:st.b[id].filter(x=>!x.busy&&x.lvl<cap);if(!free.length)continue;
    const lvl=Math.min(...free.map(x=>x.lvl));const n=bNext(iid,lvl);if(!n)continue;
    let tier=6,ord=50,why="Defense: skip unless a builder would sit idle or a Book of Building needs a target";
    if(pool.length){tier=2;ord=gi;why=fived?"On the 5D plan for TH"+th+" (to "+ge.target+")":"Finish before the next Town Hall"}
    else if(OFFENSE.includes(iid)){tier=3;ord=OFFENSE.indexOf(iid);why=fived?"Not on the 5D plan: only when a builder would sit idle":"Offense building: fill gaps with these";
      if(iid===ID.PET&&!fived)why="Pet House: prioritize once unlocked";}
    else if(ECON.includes(iid)){tier=5;ord=ECON.indexOf(iid);why="Storages and collectors beat optional defenses"}
    else if(!fived&&th>=16&&(iid===ID.EAGLE||iid===ID.CANNON||iid===ID.AT)){tier=3;ord=20;why="Needed for the TH17 merge / unlocks"}
    if(iid===ID.LAB&&labBlocking&&tier>2){tier=2;ord=9;why="Lab is blocking your farming army ("+labBlocking+")"}
    if(lvl===0){tier=2;ord=-1;why="New building: finish construction"}
    add({key:"b"+id+":"+lvl,kind:"b",id:iid,name:g.n,from:lvl,to:lvl+1,n:free.filter(x=>x.lvl===lvl).length,time:n.time,cost:n.cost,res:n.res,tier,ord,blocked:"",why});
  }
  // new buildings not yet placed
  for(const nb of newBuildingNeeds(st))if(nb.have<nb.req){const n=bNext(nb.id,0);
    add({key:"new"+nb.id,kind:"new",id:nb.id,name:GD.B[nb.id].n,from:0,to:1,n:nb.req-nb.have,time:n?n.time:0,cost:n?n.cost:0,res:GD.B[nb.id].r,tier:2,ord:-1,blocked:"",why:"New building for this Town Hall"});}
  // Town Hall
  const thCap=GD.B[ID.TH].L.length;
  if(!st.thBusy&&th<thCap){const n=bNext(ID.TH,th);const gateOpen=!thFits(st,v);
    add({key:"th",kind:"th",id:ID.TH,name:"Town Hall",from:th,to:th+1,time:n.time,cost:n.cost,res:"Gold",tier:gateOpen?3.5:1.5,ord:0,
      blocked:gateOpen?"Not yet: the rest of the TH"+th+" checklist wouldn't finish before the Town Hall does":"",why:gateOpen?"":"The rest of the checklist still finishes before the Town Hall does, so start it now"});}
  return out.sort((a,b)=>(a.blocked?1:0)-(b.blocked?1:0)||a.tier-b.tier||a.ord-b.ord||b.time-a.time);
}


function applyStart(st,c){
  const until=st.t+Math.max(60,c.time)*1000;
  if(c.kind==="h"){st.h[c.id].busy=true;st.h[c.id].until=until}
  else if(c.kind==="th"){st.thBusy=true;st.thUntil=until}
  else if(c.kind==="new"){(st.b[c.id]||(st.b[c.id]=[])).push({lvl:0,busy:true,until})}
  else{const x=st.b[c.id].find(x=>!x.busy&&x.lvl===c.from);if(x){x.busy=true;x.until=until}}
}
function applyFinish(st,j){
  if(j.kind==="h"){st.h[j.id].lvl=j.from+1;st.h[j.id].busy=false;return}
  if(j.id===ID.TH){st.th=j.from+1;st.thBusy=false;return}
  const arr=st.b[j.id];if(!arr)return;const x=arr.find(x=>x.busy&&x.lvl===j.from);if(x){x.lvl++;x.busy=false}
}

// Simulate: each builder that frees up takes the best open job.
function simulate(v,labBlocking){
  const st=makeState(v);const jobs=busyJobs(v);
  const total=SET.builders||builderCount(v);
  const free=Math.max(0,total-jobs.length);const slots=[];
  st.t=Date.now();
  for(let k=0;k<free;k++){const c=candidates(st,v,labBlocking).find(c=>!c.blocked&&c.tier<6);slots.push({job:null,next:c||null,at:Date.now()});if(c)applyStart(st,c)}
  for(const j of jobs){applyFinish(st,j);st.t=j.finish;
    let c=null;
    if(j.kind==="h"&&mainHero(st,v)===j.id&&!st.h[j.id].busy){c=candidates(st,v,labBlocking).find(x=>x.kind==="h"&&x.id===j.id&&!x.blocked)}
    if(!c)c=candidates(st,v,labBlocking).find(c=>!c.blocked&&c.tier<6);
    slots.push({job:j,next:c||null,at:j.finish});if(c)applyStart(st,c);}
  return slots;
}
function builderCount(v){return count(v.b[ID.HUT])+(v.b[ID.BOB]?1:0)}

// ---------- lab ----------
function labPlan(v){
  const th=v.th,lab=bLvl(v,ID.LAB);const rows=[];let blocking="";
  const cur=Object.entries(v.units).find(([id,u])=>u.timer);
  const order=[...SET.farm.map(id=>[id,"Farming army"]),...SET.spells.map(id=>[id,"Farming spells"])];
  const seen=new Set();
  for(const [id,tag] of order){if(seen.has(id))continue;seen.add(id);const def=uDef(id);if(!def)continue;const u=v.units[id];
    if(!u){rows.push({id,name:def.n,tag,state:"locked",note:"Unlocks with "+def.pb+" "+def.pl});continue}
    const capT=uCap(id,th),capNow=uCap(id,th,lab);
    if(u.lvl>=capT){rows.push({id,name:def.n,tag,state:"max",lvl:u.lvl,cap:capT});continue}
    const n=rNext(def,u.lvl);
    if(u.lvl>=capNow&&!blocking)blocking=def.n+" "+(u.lvl+1)+" needs Lab "+n.req;
    rows.push({id,name:def.n,tag,state:u.timer?"busy":u.lvl>=capNow?"block":"go",lvl:u.lvl,cap:capT,time:n.time,cost:n.cost,res:def.r,req:n.req});
  }
  const rest=[];
  for(const id in v.units){if(seen.has(+id))continue;const def=uDef(id);const u=v.units[id];const capT=uCap(+id,th);if(u.lvl>=capT)continue;
    const capNow=uCap(+id,th,lab);const n=rNext(def,u.lvl);
    rest.push({id:+id,name:def.n,tag:"Everything else",state:u.timer?"busy":u.lvl>=capNow?"block":"go",lvl:u.lvl,cap:capT,time:n.time,cost:n.cost,res:def.r,req:n.req,pct:u.lvl/capT});}
  rest.sort((a,b)=>(a.state==="block")-(b.state==="block")||a.pct-b.pct);
  // troops/spells that this TH can unlock but aren't unlocked yet
  const locked=[];
  for(const id in Object.assign({},GD.U,GD.SP)){if(v.units[id])continue;const def=uDef(id);if(!def.L.length||def.L[0][0]>th)continue;
    const pbId={"Barracks":ID.BAR,"Dark Barracks":ID.DBAR,"Spell Factory":ID.SF,"Dark Spell Factory":ID.DSF,"Workshop":ID.WS}[def.pb];
    if(!pbId)continue;if(def.pl>bCap(pbId,th))continue;
    locked.push({name:def.n,need:def.pb+" "+def.pl,have:bLvl(v,pbId)});}
  return {rows,rest,locked,blocking,cur:cur?{name:uDef(cur[0]).n,from:cur[1].lvl,finish:v.ts+cur[1].timer*1000}:null,lab,labCap:bCap(ID.LAB,th)};
}


// ---------- long-range timeline ----------
function kindOf(kind,id){
  if(kind==="h")return "hero";
  if(id===ID.TH)return "th";
  if(GATE.includes(id)||kind==="new")return "gate";
  if(OFFENSE.includes(id))return "off";
  if(ECON.includes(id))return "econ";
  return "def";
}
// Run the rush rules forward: every builder that frees up takes the best open job, until the horizon.
function simulateTimeline(v,labBlocking,days){
  const st=makeState(v);const now=Date.now();const end=now+days*DAY*1000;
  const total=SET.builders||builderCount(v);const jobs=busyJobs(v);
  const rows=[];const q=[];const events=[];

// ---------- My Plan: hand-assigned upgrade queues ----------
// Every upgrade level is its own item. Objects are one per building instance, hero, troop/spell/siege and pet;
// each queue (a builder, the Lab, the Pet House) runs its items back to back after its current upgrade.
// Saved shape: {q:{b1:[{o,to}],...,lab:[...],pet:[...]}, run:{objKey:queueId}} (run = which builder holds a running upgrade).
let MP=vget("vp",null)||{q:{},run:{}};

const TH_MAX=()=>GD.B[ID.TH].L.length;
// How many of a building a Town Hall allows (merged Cannons/Archer Towers/Wizard Towers keep their TH15 count).

function mpObjects(v){

  const fin=t=>t?v.ts+t*1000:0;
  add({key:"th",kind:"b",id:ID.TH,inst:1,name:"Town Hall",lvl:v.th,cur:v.th+(v.thTimer?1:0),fin:fin(v.thTimer),q:"b",cat:"Town Hall",max:TH_MAX()});
  const blds=(src,ids,kind)=>{for(const id of ids){if(+id===ID.WALL||+id===ID.TH)continue;const g=(src==="T"?GD.T:GD.B)[id];if(!g)continue;
    const arr=[];for(const x of ((src==="T"?v.traps:v.b)[id]||[]))for(let k=0;k<x.n;k++)arr.push({lvl:x.lvl,fin:fin(x.timer)});

      add({key:kind+":"+id+":"+(k+1),kind:"b",id:+id,inst:k+1,n:total,isNew:k>=have,name:g.n+(total>1?" #"+(k+1):""),lvl:x.lvl,cur:x.lvl+(x.fin?1:0),fin:x.fin,q:"b",
        cat:src==="T"?"Traps":({Army:"Army",Resource:"Resources",Defense:"Defenses",Worker:"Builder huts"})[g.t]||"Other",max:g.L.length});}}};
  blds("B",new Set([...Object.keys(v.b),...Object.keys(requiredCounts(TH_MAX()))].filter(id=>GD.B[id])),"b");
  blds("T",new Set([...Object.keys(v.traps),...Object.keys(requiredCounts(TH_MAX()))].filter(id=>GD.T[id])),"t");

// Cost, time and requirements of taking an object to level `to`.
function mpStep(o,to){
  if(o.kind==="b"){const g=GD.B[o.id]||GD.T[o.id];const e=g.L[to-1];return e?{time:e[1],cost:e[2],res:g.r,th:e[0]}:null}

// The highest level an object can reach at a Town Hall (ignoring Hero Hall / Lab / Pet House).
function mpCap(o,th){

  if(o.kind==="b"){if(o.isNew&&instCount(o.id,th)<o.inst)return 0;return bCap(o.id,th)}

}
const mpQueues=v=>{const n=SET.builders||builderCount(v);const q=[];for(let i=1;i<=n;i++)q.push({id:"b"+i,label:"Builder "+i,type:"b"});
  q.push({id:"lab",label:"Lab",type:"lab"});if(v.th>=14||Object.keys(v.pets).length||mpPlannedTH(v)>=14)q.push({id:"pet",label:"Pet House",type:"pet"});return q};
const mpItems=()=>Object.values(MP.q).flat();
function mpPlannedTH(v){let t=v.th+(v.thTimer?1:0);for(const it of mpItems())if(it.o==="th")t=Math.max(t,it.to);return t}
function mpNext(o){let t=o.cur;for(const it of mpItems())if(it.o===o.key)t=Math.max(t,it.to);return t+1}

// Drop items a fresh export shows as done or started; remember which builder a started item was on.
function mpReconcile(R){
  let changed=false;
  for(const qid in MP.q){MP.q[qid]=MP.q[qid].filter(it=>{const o=R.O[it.o];if(!o)return true;
    if(it.to<=o.cur){if(o.fin&&it.to===o.cur&&qid[0]==="b"){MP.run[o.key]=qid}changed=true;return false}return true})}
  for(const k in MP.run)if(!R.O[k]||!R.O[k].fin){delete MP.run[k];changed=true}
  if(changed)mpSave();
}

function mpSchedule(v,R){
  const now=Date.now();const queues=mpQueues(v).map(q=>Object.assign({},q,{head:null,items:[]}));
  const byQ=id=>queues.find(q=>q.id===id);
  // current upgrades become each queue's first, fixed item
  const running=Object.values(R.O).filter(o=>o.fin).sort((a,b)=>a.fin-b.fin);
  const bq=()=>queues.filter(q=>q.type==="b");
  for(const o of running){
    if(o.q!=="b"){const q=byQ(o.q);if(q&&!q.head)q.head=o;continue}
    let q=MP.run[o.key]&&byQ(MP.run[o.key]);if(q&&q.head)q=null;
    if(!q){q=bq().find(q=>!q.head&&!Object.values(MP.run).includes(q.id));if(!q)q=bq().find(q=>!q.head)}
    if(!q){q={id:"x"+o.key,label:"Extra builder",type:"b",head:null,items:[],extra:true};queues.splice(bq().length,0,q)}
    q.head=o;}
  const steps=[];
  for(const q of queues){
    let t=now;
    if(q.head){const s={o:q.head,to:q.head.cur,start:q.head.fin,end:q.head.fin,running:true};steps.push(s);q.headStep=s;t=Math.max(now,q.head.fin)}
    for(const it of (MP.q[q.id]||[])){const o=R.O[it.o];const st=o&&mpStep(o,it.to);
      const s={it,o,to:it.to,st,start:t,end:t+(st?st.time*1000:0),q:q.id,warn:o&&st?"":"Not in your village data any more"};
      q.items.push(s);if(o&&st)steps.push(s);t=s.end;}
    q.end=t;}
  // levels at a moment, from finished steps
  const doneBy=(key,t)=>steps.filter(s=>s.o.key===key&&s.end<=t).length;
  const lvlAt=(key,t)=>{const o=R.O[key];return o?o.lvl+doneBy(key,t):0};
  const thAt=t=>lvlAt("th",t);
  const one=id=>"b:"+id+":1";
  for(const q of queues)for(const s of q.items){if(s.warn)continue;const o=s.o,st=s.st,t=s.start;const w=[];
    const th=thAt(t);
    if(st.th>th)w.push("Needs TH"+st.th+" (TH"+th+" then)");
    if(o.kind==="b"&&o.isNew&&s.to===1&&instCount(o.id,th)<o.inst)w.push("TH"+th+" allows only "+instCount(o.id,th));
    if(o.kind==="h"&&st.need>lvlAt(one(ID.HH),t))w.push("Needs Hero Hall "+st.need);
    if(o.kind==="u"&&st.need>lvlAt(one(ID.LAB),t))w.push("Needs Lab "+st.need);
    if(o.kind==="p"&&st.need>lvlAt(one(ID.PET),t))w.push("Needs Pet House "+st.need);
    const prev=steps.find(p=>p.o.key===o.key&&p.to===s.to-1);
    if(s.to-1>o.cur&&!prev)w.push("Level "+(s.to-1)+" isn't planned");
    else if(prev&&prev.end>t+1000)w.push("Starts before level "+(s.to-1)+" is done ("+whenD(prev.end)+")");
    if(steps.some(p=>p!==s&&p.o.key===o.key&&p.to===s.to))w.push("Planned twice");
    s.warn=w.join(" · ");}
  const tot={};for(const q of queues)for(const s of q.items)if(s.st&&s.st.cost)tot[s.st.res]=(tot[s.st.res]||0)+s.st.cost;
  return {queues,tot,thEnd:mpPlannedTH(v)};
}

// Turn the recommended plan's next 30 days into items (builders and Lab; the Pet House queue is kept).
function mpCopyRecommended(){
  const R=mpObjects(V);const lp=labPlan(V);const sim=simulateTimeline(V,lp.blocking,60);const lab=simulateLab(V,sim.events,60);
  const horizon=Date.now()+30*DAY*1000;const lv={};for(const k in R.O)lv[k]=R.O[k].cur;
  const q={};const bars=[];
  sim.rows.forEach((r,i)=>{q["b"+(i+1)]=[];for(const b of r)if(!b.running&&b.start<horizon)bars.push([("b"+(i+1)),b])});
  bars.sort((a,b)=>a[1].start-b[1].start);
  for(const [qid,b] of bars){let key=null;
    if(b.kind==="h")key="h:"+b.id;else if(b.id===ID.TH)key="th";
    else{const o=(R.byId[b.id]||[]).find(o=>lv[o.key]===b.from);if(o)key=o.key}
    if(!key||!R.O[key])continue;lv[key]=b.to;q[qid].push({o:key,to:b.to});}
  q.lab=lab.filter(b=>!b.running&&b.start<horizon&&R.O["u:"+b.id]).map(b=>({o:"u:"+b.id,to:b.to}));
  if(MP.q.pet)q.pet=MP.q.pet;
  MP={q,run:{}};
}

function renderTracker(){
  const el=document.getElementById("v-tracker");const th=V.th;
  const sections=[];
  const bSec=(title,ids)=>{const rows=[];let a=0,b=0;
    for(const id of ids){const g=V.b[id]||V.traps[id];if(!g)continue;const cap=bCap(id,th);if(!cap)continue;const n=count(g);
      const lv={};g.forEach(x=>lv[x.lvl]=(lv[x.lvl]||0)+x.n);const sum=g.reduce((s,x)=>s+Math.min(x.lvl,cap)*x.n,0);a+=sum;b+=cap*n;
      const up=g.filter(x=>x.timer).length;
      rows.push({name:(GD.B[id]||GD.T[id]).n,n,cap,pct:sum/(cap*n),inst:Object.keys(lv).sort((x,y)=>y-x).map(l=>l+(lv[l]>1?" ×"+lv[l]:"")).join(", ")+(up?" · "+up+" upgrading":"")});}
    sections.push({title,rows,pct:b?a/b:1});};
  const typeIds=t=>Object.keys(GD.B).filter(id=>GD.B[id].t===t&&+id!==ID.TH&&+id!==ID.WALL).map(Number);
  bSec("Army",typeIds("Army"));
  // heroes
  {const rows=[];let a=0,b=0;for(const id of HERO_ORDER){const x=V.heroes[id];const cap=hCap(id,th);if(!cap)continue;const l=x?x.lvl:0;a+=Math.min(l,cap);b+=cap;rows.push({name:GD.H[id].n,n:1,cap,pct:l/cap,inst:x?String(l)+(x.timer?" · upgrading":""):"not recruited"})}sections.push({title:"Heroes",rows,pct:a/b})}
  // lab
  {const rows=[];let a=0,b=0;for(const id in V.units){const cap=uCap(+id,th);if(!cap)continue;const l=V.units[id].lvl;a+=Math.min(l,cap);b+=cap;rows.push({name:uDef(id).n,n:1,cap,pct:l/cap,inst:String(l)+(V.units[id].timer?" · researching":"")})}
   rows.sort((x,y)=>x.pct-y.pct);sections.push({title:"Troops, spells & sieges",rows,pct:b?a/b:1})}
  // equipment
  {const rows=[];let a=0,b=0;for(const id in V.equip){if(!GD.E[id])continue;const cap=eCap(+id,th);if(!cap)continue;const l=V.equip[id];a+=Math.min(l,cap);b+=cap;rows.push({name:GD.E[id].n,n:1,cap,pct:l/cap,inst:String(l)})}
   rows.sort((x,y)=>y.pct-x.pct);sections.push({title:"Equipment",rows,pct:b?a/b:1})}
  bSec("Resources",typeIds("Resource"));
  bSec("Defenses",typeIds("Defense").filter(id=>id!==ID.CRAFT));
  bSec("Traps",Object.keys(GD.T).map(Number));
  bSec("Walls",[ID.WALL]);
  let h='<div><h2>TH'+th+' progress</h2><p class="sub" style="margin-bottom:8px">Share of levels done against TH'+th+' max levels.</p><div class="summary">'+sections.map(s=>'<div class="sum"><span>'+esc(s.title.split(",")[0])+'</span><b>'+Math.round(s.pct*100)+'%</b><div class="bar'+(s.pct>=1?" full":"")+'"><i style="width:'+s.pct*100+'%"></i></div></div>').join("")+'</div></div>';
  for(const s of sections){
    h+='<details'+(s.title==="Army"?" open":"")+'><summary>'+esc(s.title)+' · '+Math.round(s.pct*100)+'%</summary><div class="inner">';
    for(const r of s.rows){const full=r.pct>=1;h+='<div class="trow"><div><b>'+esc(r.name)+'</b>'+(r.n>1?' <span class="muted">×'+r.n+'</span>':'')+'</div><div class="lv">max '+r.cap+'</div><div class="inst">'+esc(r.inst)+'</div><div class="bar'+(full?" full":"")+'"><i style="width:'+Math.min(100,r.pct*100)+'%"></i></div></div>'}
    h+='</div></details>';}
  el.innerHTML=h;
}

      if(VIL.active===tag)switchVillage(VIL.list[0].tag);else{vilSave();renderAll()}
      msg("Removed "+vilName(r)+".",true)}});
  el.querySelectorAll(".pick").forEach(b=>b.onclick=()=>{const k=b.dataset.k,id=+b.dataset.id;const a=SET[k];const i=a.indexOf(id);if(i>=0)a.splice(i,1);else a.push(id);vset("vs",SET);renderAll(true)});
  el.querySelectorAll("button.style").forEach(b=>b.onclick=()=>{SET.style=b.dataset.s;vset("vs",SET);el.querySelectorAll("button.style").forEach(x=>x.setAttribute("aria-pressed",x.dataset.s===SET.style));renderAll(true)});
  document.getElementById("bcount").onchange=e=>{const n=+e.target.value;SET.builders=n>0&&n!==builderCount(V)?n:0;vset("vs",SET);renderAll(true)};
}

// Android app only: hand the running timers to the home-screen widget.
// Every village with a saved export is listed; names get the village's name in front once there are several.
function syncWidget(){
  if(!window.RushPlannerAndroid)return;
  const vs=[];for(const r of VIL.list){const j=store.get("vd:"+r.tag,null);if(!j)continue;try{vs.push([r,parseVillage(j)])}catch(e){}}
  const jobs=[];let ts=0;
  for(const [r,v] of vs){const pre=vs.length>1?vilName(r)+": ":"";ts=Math.max(ts,v.ts);
    for(const j of busyJobs(v))jobs.push({kind:j.kind==="h"?"Hero":"Builder",name:pre+j.name+" "+(j.from+1),finish:j.finish});
    for(const id in v.units){const u=v.units[id];if(u.timer)jobs.push({kind:"Lab",name:pre+(uDef(id).n||"Research")+" "+(u.lvl+1),finish:v.ts+u.timer*1000})}
    for(const id in v.pets){const p=v.pets[id];if(p.timer)jobs.push({kind:"Pet",name:pre+((GD.P[id]||{}).n||"Pet")+" "+(p.lvl+1),finish:v.ts+p.timer*1000})}}
  jobs.sort((a,b)=>a.finish-b.finish);
  try{RushPlannerAndroid.setTimers(JSON.stringify({saved:vs.length>0,tag:V.tag,ts:ts||V.ts,jobs}))}catch(e){}
}

function renderAll(keepImport){syncWidget();headerMeta();renderVillageSelect();renderPlan();renderTimeline();renderMyPlan();renderLab();renderHeroes();renderTracker();renderGuide();if(!keepImport)renderImport();else{
  // refresh pick states without wiping the paste box
  document.querySelectorAll(".pick").forEach(b=>b.setAttribute("aria-pressed",SET[b.dataset.k].includes(+b.dataset.id)))}}

// tabs
function show(v){document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v));
  document.querySelectorAll("section.view").forEach(s=>s.hidden=s.id!=="v-"+v);document.querySelector(".wrap").classList.toggle("wide",v==="timeline"||v==="myplan");store.set("tab",v);document.querySelectorAll("#v-"+v+" .gantt").forEach(g=>g._refresh&&g._refresh())}
document.getElementById("tabs").onclick=e=>{const b=e.target.closest("button");if(b)show(b.dataset.v)};

load();renderAll();
const initTab=(location.hash||"").slice(1);show(["plan","timeline","myplan","lab","heroes","tracker","guide","import"].includes(initTab)?initTab:store.get("tab","plan"));
setInterval(()=>{headerMeta();renderPlan()},60000);
</script>
